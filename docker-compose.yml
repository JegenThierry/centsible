services:

  budget_planner_db:
    image: postgres:18.3-alpine
    container_name: budget_planner_db

    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8 -c app.db_name=${POSTGRES_DB}"
      TZ: ${TZ:-UTC}
      PGTZ: ${TZ:-UTC}

    volumes:
      - postgres_data:/var/lib/postgresql
      - ./budget-planner-db/database.sql:/docker-entrypoint-initdb.d/00_database.sql:ro,z
      - ./budget-planner-db/tables.sql:/docker-entrypoint-initdb.d/01_tables.sql:ro,z
      - ./budget-planner-db/categories.sql:/docker-entrypoint-initdb.d/02_categories.sql:ro,z
      - ./budget-planner-db/migrations:/migrations:ro,z
      - ./budget-planner-db/run-migrations.sh:/docker-entrypoint-initdb.d/03_run-migrations.sh:ro,z

    ports:
      - "${DB_HOST_PORT:-5432}:5432"

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - budget_planner_net

  budget_planner_migrations:
    image: postgres:18.3-alpine
    container_name: budget_planner_migrations
    depends_on:
      budget_planner_db:
        condition: service_healthy
    volumes:
      - ./budget-planner-db/migrations:/migrations:ro,z
      - ./budget-planner-db/run-migrations.sh:/run-migrations.sh:ro,z
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGHOST: budget_planner_db
      TZ: ${TZ:-UTC}
    entrypoint: [ "/bin/bash", "/run-migrations.sh" ]
    networks:
      - budget_planner_net

  budget_planner_rest:
    build:
      context: .
      dockerfile: budget-planner-rest/Dockerfile
    container_name: budget_planner_rest

    develop:
      watch:
        - action: rebuild
          path: ./budget-planner-rest/src
        - action: rebuild
          path: ./budget-planner-core/src
        - action: rebuild
          path: ./budget-planner-api/src
        - action: rebuild
          path: ./budget-planner-jooq/src
        - action: rebuild
          path: ./build.gradle.kts

    restart: unless-stopped

    depends_on:
      budget_planner_migrations:
        condition: service_completed_successfully

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://budget_planner_db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      SKIP_EMAIL_VERIFICATION: ${SKIP_EMAIL_VERIFICATION:-false}
      JAVA_OPTS: ${JAVA_OPTS:--Xms128m -Xmx384m}
      TZ: ${TZ:-UTC}

    ports:
      - "${REST_HOST_PORT:-8080}:8080"

    healthcheck:
      test: [ "CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8080/actuator/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - budget_planner_net

  budget_planner_ui:
    build:
      context: ./budget-planner-ui
      dockerfile: Dockerfile
      target: dev
    container_name: budget_planner_ui

    develop:
      watch:
        - action: sync
          path: ./budget-planner-ui/app
          target: /app/app
        - action: rebuild
          path: ./budget-planner-ui/package.json

    restart: unless-stopped

    depends_on:
      budget_planner_rest:
        condition: service_healthy

    environment:
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-http://localhost:8080/api}
      NUXT_API_BASE_SSR: ${NUXT_API_BASE_SSR:-http://budget_planner_rest:8080/api}
      TZ: ${TZ:-UTC}

    ports:
      - "${UI_HOST_PORT:-3000}:3000"

    volumes:
      - ./budget-planner-ui:/app:z
      - node_modules_ui:/app/node_modules

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - budget_planner_net

networks:
  budget_planner_net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  node_modules_ui:
    driver: local
