services:

  budget_planner_db:
    image: postgres:18.3-alpine
    container_name: budget_planner_db

    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8 -c app.db_name=${POSTGRES_DB}"
      TZ: UTC
      PGTZ: UTC

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./budget-planner-db/database.sql:/docker-entrypoint-initdb.d/00_database.sql:ro,z
      - ./budget-planner-db/tables.sql:/docker-entrypoint-initdb.d/01_tables.sql:ro,z
      - ./budget-planner-db/categories.sql:/docker-entrypoint-initdb.d/02_categories.sql:ro,z
      - ./budget-planner-db/migrations/01_AddInitalBalanceToAccounts.sql:/docker-entrypoint-initdb.d/03_01_AddInitalBalanceToAccounts.sql:ro,z
      - ./budget-planner-db/migrations/02_AddRegistrationToUsers.sql:/docker-entrypoint-initdb.d/04_02_AddRegistrationToUsers.sql:ro,z
      - ./budget-planner-db/migrations/03_CategoryTypeAndTransactionRefactor.sql:/docker-entrypoint-initdb.d/05_03_CategoryTypeAndTransactionRefactor.sql:ro,z
      - ./budget-planner-db/migrations/04_AddColorToCategories.sql:/docker-entrypoint-initdb.d/06_04_AddColorToCategories.sql:ro,z
      - ./budget-planner-db/migrations/05_AddProfilePictureToUsers.sql:/docker-entrypoint-initdb.d/07_05_AddProfilePictureToUsers.sql:ro,z

    ports:
      - "${DB_HOST_PORT}:5432"

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - budget_planner_net

  budget_planner_rest:
    build:
      context: ./budget-planner-rest
      dockerfile: Dockerfile
    container_name: budget_planner_rest

    restart: unless-stopped

    depends_on:
      budget_planner_db:
        condition: service_healthy

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://budget_planner_db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      JAVA_OPTS: "-Xms128m -Xmx384m"
      TZ: UTC

    ports:
      - "${REST_HOST_PORT:-8080}:8080"

    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - budget_planner_net

  budget_planner_ui:
    build:
      context: ./budget-planner-ui
      dockerfile: Dockerfile
      target: dev
    container_name: budget_planner_ui

    restart: unless-stopped

    depends_on:
      - budget_planner_rest

    environment:
      NUXT_PUBLIC_API_BASE: "http://localhost:${REST_HOST_PORT:-8080}/api"
      NUXT_API_BASE_SSR: "http://budget_planner_rest:${REST_HOST_PORT:-8080}/api"

    ports:
      - "${UI_HOST_PORT:-3000}:3000"

    volumes:
      - ./budget-planner-ui:/app:z
      - ./budget-planner-ui/node_modules:/app/node_modules:z

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - budget_planner_net

networks:
  budget_planner_net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
