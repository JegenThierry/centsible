services:

  centsible-db:
    image: postgres:18.3-alpine
    container_name: centsible-db

    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8 -c app.db_name=${POSTGRES_DB}"
      TZ: ${TZ:-UTC}
      PGTZ: ${TZ:-UTC}

    volumes:
      - postgres_data:/var/lib/postgresql
      - ./centsible-db/database.sql:/docker-entrypoint-initdb.d/00_database.sql:ro,z
      - ./centsible-db/tables.sql:/docker-entrypoint-initdb.d/01_tables.sql:ro,z
      - ./centsible-db/categories.sql:/docker-entrypoint-initdb.d/02_categories.sql:ro,z
      - ./centsible-db/migrations:/migrations:ro,z
      - ./centsible-db/run-migrations.sh:/docker-entrypoint-initdb.d/03_run-migrations.sh:ro,z

    # 127.0.0.1 only — host-local access (jooqCodegen, psql), never public.
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - centsible-net

  centsible-migrations:
    image: postgres:18.3-alpine
    container_name: centsible-migrations
    depends_on:
      centsible-db:
        condition: service_healthy
    volumes:
      - ./centsible-db/migrations:/migrations:ro,z
      - ./centsible-db/run-migrations.sh:/run-migrations.sh:ro,z
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGHOST: centsible-db
      TZ: ${TZ:-UTC}
    entrypoint: [ "/bin/bash", "/run-migrations.sh" ]
    networks:
      - centsible-net

  centsible-rest:
    build:
      context: .
      dockerfile: centsible-rest/Dockerfile
    container_name: centsible-rest

    develop:
      watch:
        - action: rebuild
          path: ./centsible-rest/src
        - action: rebuild
          path: ./centsible-core/src
        - action: rebuild
          path: ./centsible-api/src
        - action: rebuild
          path: ./centsible-jooq/src
        - action: rebuild
          path: ./build.gradle.kts

    restart: unless-stopped

    depends_on:
      centsible-migrations:
        condition: service_completed_successfully

    environment:
      # Set to "prod" in .env for public deployments — activates ProductionGuard.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      SPRING_DATASOURCE_URL: jdbc:postgresql://centsible-db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-14400000}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      SKIP_EMAIL_VERIFICATION: ${SKIP_EMAIL_VERIFICATION:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      # 11MB / 12MB give a small headroom over the 10MB attachment cap enforced in the controller.
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: ${MULTIPART_MAX_FILE_SIZE:-11MB}
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: ${MULTIPART_MAX_REQUEST_SIZE:-12MB}
      ATTACHMENTS_DIRECTORY: /var/centsible/attachments
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-false}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-}
      # Only enable behind a trusted proxy — otherwise the rate-limit IP can be spoofed.
      SERVER_FORWARD_HEADERS_STRATEGY: ${SERVER_FORWARD_HEADERS_STRATEGY:-framework}
      INTEGRATIONS_ENCRYPTION_KEY: ${INTEGRATIONS_ENCRYPTION_KEY:-}
      INTEGRATIONS_ENCRYPTION_SALT: ${INTEGRATIONS_ENCRYPTION_SALT:-}
      INTEGRATIONS_SYNC_POLL_INTERVAL_MS: ${INTEGRATIONS_SYNC_POLL_INTERVAL_MS:-300000}
      INTEGRATIONS_SYNC_INTERVAL_SECONDS: ${INTEGRATIONS_SYNC_INTERVAL_SECONDS:-3600}
      JAVA_OPTS: ${JAVA_OPTS:--Xms128m -Xmx384m}
      TZ: ${TZ:-UTC}

    ports:
      - "${REST_HOST_PORT:-8080}:8080"

    volumes:
      - attachments_data:/var/centsible/attachments

    healthcheck:
      test: [ "CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8080/actuator/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - centsible-net

  centsible-export:
    build:
      context: .
      dockerfile: centsible-export/Dockerfile
    container_name: centsible-export

    develop:
      watch:
        - action: rebuild
          path: ./centsible-export/src
        - action: rebuild
          path: ./centsible-proto/src
        - action: rebuild
          path: ./centsible-api/src
        - action: rebuild
          path: ./centsible-jooq/src
        - action: rebuild
          path: ./build.gradle.kts

    restart: unless-stopped

    depends_on:
      centsible-migrations:
        condition: service_completed_successfully

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://centsible-db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL}
      EXPORT_POLL_INTERVAL_MS: ${EXPORT_POLL_INTERVAL_MS:-2000}
      EXPORT_LEASE_TIMEOUT_SECONDS: ${EXPORT_LEASE_TIMEOUT_SECONDS:-300}
      JAVA_OPTS: ${EXPORT_JAVA_OPTS:--Xms256m -Xmx512m}
      TZ: ${TZ:-UTC}

    # Internal worker — no auth on its endpoints; never publish ports.
    healthcheck:
      test: [ "CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8081/actuator/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - centsible-net

  centsible-ui:
    build:
      context: ./centsible-ui
      dockerfile: Dockerfile
      target: dev
    container_name: centsible-ui

    develop:
      watch:
        - action: sync
          path: ./centsible-ui/app
          target: /app/app
        - action: rebuild
          path: ./centsible-ui/package.json

    restart: unless-stopped

    depends_on:
      centsible-rest:
        condition: service_healthy

    environment:
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-http://localhost:8080/api}
      NUXT_API_BASE_SSR: ${NUXT_API_BASE_SSR:-http://centsible-rest:8080/api}
      TZ: ${TZ:-UTC}

    ports:
      - "${UI_HOST_PORT:-3000}:3000"

    volumes:
      - ./centsible-ui:/app:z
      - node_modules_ui:/app/node_modules

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - centsible-net

networks:
  centsible-net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  node_modules_ui:
    driver: local
  attachments_data:
    driver: local
