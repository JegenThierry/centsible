services:

  centsible-db:
    image: postgres:18.3-alpine
    container_name: centsible-db

    restart: unless-stopped
    init: true

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-centsible}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8 -c app.db_name=${POSTGRES_DB:-centsible}"
      TZ: ${TZ:-UTC}
      PGTZ: ${TZ:-UTC}

    volumes:
      - postgres_data:/var/lib/postgresql
      - ./centsible-db/database.sql:/docker-entrypoint-initdb.d/00_database.sql:ro,z
      - ./centsible-db/tables.sql:/docker-entrypoint-initdb.d/01_tables.sql:ro,z
      - ./centsible-db/migrations:/migrations:ro,z
      - ./centsible-db/run-migrations.sh:/docker-entrypoint-initdb.d/02_run-migrations.sh:ro,z

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-centsible}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW

    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - centsible-net

  centsible-migrations:
    image: postgres:18.3-alpine
    container_name: centsible-migrations
    depends_on:
      centsible-db:
        condition: service_healthy
    volumes:
      - ./centsible-db/migrations:/migrations:ro,z
      - ./centsible-db/run-migrations.sh:/run-migrations.sh:ro,z
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-centsible}
      PGHOST: centsible-db
      TZ: ${TZ:-UTC}
    entrypoint: [ "/bin/bash", "/run-migrations.sh" ]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW
    networks:
      - centsible-net

  centsible-rest:
    build:
      context: .
      dockerfile: centsible-rest/Dockerfile
    image: centsible-rest:${CENTSIBLE_VERSION:-local}
    container_name: centsible-rest

    restart: unless-stopped
    init: true
    stop_grace_period: 30s

    depends_on:
      centsible-migrations:
        condition: service_completed_successfully

    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_DATASOURCE_URL: jdbc:postgresql://centsible-db:5432/${POSTGRES_DB:-centsible}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-14400000}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      SKIP_EMAIL_VERIFICATION: ${SKIP_EMAIL_VERIFICATION:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: ${MULTIPART_MAX_FILE_SIZE:-11MB}
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: ${MULTIPART_MAX_REQUEST_SIZE:-12MB}
      ATTACHMENTS_DIRECTORY: /var/centsible/attachments
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-false}
      ADMIN_ENABLED: ${ADMIN_ENABLED:-false}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-}
      SERVER_FORWARD_HEADERS_STRATEGY: ${SERVER_FORWARD_HEADERS_STRATEGY:-framework}
      SERVER_SHUTDOWN: graceful
      SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE: 20s
      INTEGRATIONS_ENCRYPTION_KEY: ${INTEGRATIONS_ENCRYPTION_KEY:-}
      INTEGRATIONS_ENCRYPTION_SALT: ${INTEGRATIONS_ENCRYPTION_SALT:-}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?MFA_ENCRYPTION_KEY must be set in .env}
      MFA_ENCRYPTION_SALT: ${MFA_ENCRYPTION_SALT:?MFA_ENCRYPTION_SALT must be set in .env}
      INTEGRATIONS_SYNC_POLL_INTERVAL_MS: ${INTEGRATIONS_SYNC_POLL_INTERVAL_MS:-300000}
      INTEGRATIONS_SYNC_INTERVAL_SECONDS: ${INTEGRATIONS_SYNC_INTERVAL_SECONDS:-3600}
      INTEGRATIONS_MANUAL_ENABLED: ${INTEGRATIONS_MANUAL_ENABLED:-true}
      INTEGRATIONS_BASE_URL: ${INTEGRATIONS_BASE_URL:-}
      INTEGRATIONS_UI_BASE_URL: ${INTEGRATIONS_UI_BASE_URL:-}
      INTEGRATIONS_PAYPAL_ENABLED: ${INTEGRATIONS_PAYPAL_ENABLED:-false}
      INTEGRATIONS_PAYPAL_DEFAULT_ENVIRONMENT: ${INTEGRATIONS_PAYPAL_DEFAULT_ENVIRONMENT:-live}
      INTEGRATIONS_PAYPAL_HTTP_TIMEOUT_MS: ${INTEGRATIONS_PAYPAL_HTTP_TIMEOUT_MS:-15000}
      INTEGRATIONS_BANKING_GOCARDLESS_ENABLED: ${INTEGRATIONS_BANKING_GOCARDLESS_ENABLED:-false}
      INTEGRATIONS_BANKING_GOCARDLESS_SECRET_ID: ${INTEGRATIONS_BANKING_GOCARDLESS_SECRET_ID:-}
      INTEGRATIONS_BANKING_GOCARDLESS_SECRET_KEY: ${INTEGRATIONS_BANKING_GOCARDLESS_SECRET_KEY:-}
      INTEGRATIONS_BANKING_GOCARDLESS_MIN_SYNC_INTERVAL_SECONDS: ${INTEGRATIONS_BANKING_GOCARDLESS_MIN_SYNC_INTERVAL_SECONDS:-21600}
      JAVA_OPTS: ${JAVA_OPTS:--Xms128m -Xmx384m}
      TZ: ${TZ:-UTC}

    volumes:
      - attachments_data:/var/centsible/attachments

    healthcheck:
      test: [ "CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8080/actuator/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW

    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - centsible-net
      - proxy-net

  centsible-export:
    build:
      context: .
      dockerfile: centsible-export/Dockerfile
    image: centsible-export:${CENTSIBLE_VERSION:-local}
    container_name: centsible-export

    restart: unless-stopped
    init: true
    stop_grace_period: 30s

    depends_on:
      centsible-migrations:
        condition: service_completed_successfully

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://centsible-db:5432/${POSTGRES_DB:-centsible}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL}
      EXPORT_POLL_INTERVAL_MS: ${EXPORT_POLL_INTERVAL_MS:-2000}
      EXPORT_LEASE_TIMEOUT_SECONDS: ${EXPORT_LEASE_TIMEOUT_SECONDS:-300}
      EXPORT_RENDER_TIMEOUT_MS: ${EXPORT_RENDER_TIMEOUT_MS:-60000}
      JAVA_OPTS: ${EXPORT_JAVA_OPTS:--Xms256m -Xmx512m}
      TZ: ${TZ:-UTC}

    healthcheck:
      test: [ "CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8081/actuator/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW

    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - centsible-net

  centsible-ui:
    build:
      context: ./centsible-ui
      dockerfile: Dockerfile
      target: release
    image: centsible-ui:${CENTSIBLE_VERSION:-local}
    container_name: centsible-ui

    restart: unless-stopped
    init: true
    stop_grace_period: 15s

    depends_on:
      centsible-rest:
        condition: service_healthy

    environment:
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-http://localhost:8080/api}
      NUXT_API_BASE_SSR: ${NUXT_API_BASE_SSR:-http://centsible-rest:8080/api}
      TZ: ${TZ:-UTC}

    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:3000/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW

    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 192M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - centsible-net
      - proxy-net

networks:
  centsible-net:
    driver: bridge
  proxy-net:
    name: ${PROXY_NETWORK:-nginx-proxy-manager_default}
    external: true

volumes:
  postgres_data:
    driver: local
  attachments_data:
    driver: local
