# Validation messages — referenced from DTOs with {key} placeholders.
validation.generic.invalid=Invalid value.

validation.username.required=Username is required.
validation.username.pattern=Username must be 3-50 characters and contain only letters, digits, '.', '_' or '-'.

validation.password.required=Password is required.
validation.password.tooLong=Password must be at most 72 characters.
validation.password.strength=Password must be 8+ characters with upper and lower case letters, a digit, and one of @$!%*?&.

validation.email.required=Email is required.
validation.email.invalid=Email must be a valid address.
validation.email.tooLong=Email must be at most 255 characters.

validation.firstName.required=First name is required.
validation.firstName.tooLong=First name must be at most 100 characters.

validation.lastName.required=Last name is required.
validation.lastName.tooLong=Last name must be at most 100 characters.

validation.locale.required=Locale is required.
validation.locale.unsupported=Locale must be one of: en, fr, de.

validation.token.required=Token is required.
validation.token.invalid=Token is invalid.

validation.amount.required=Amount is required.
validation.amount.tooSmall=Amount must be greater than 0.
validation.amount.tooLarge=Amount must not exceed 9,999,999.99.
validation.amount.fraction=Amount must have at most 2 decimal places.

validation.description.required=Description is required.
validation.description.range=Description must be 1-255 characters.
validation.description.tooLong=Description must be at most 255 characters.

validation.transactionDate.required=Transaction date is required.

validation.category.required=Category is required.
validation.category.positive=Category id must be positive.
validation.category.name.required=Category name is required.
validation.category.name.tooLong=Category name must be at most 50 characters.
validation.category.icon.required=Icon is required.
validation.category.icon.tooLong=Icon must be at most 50 characters.
validation.category.icon.pattern=Icon must be a Lucide name like 'i-lucide-tag'.
validation.category.color.required=Color is required.
validation.category.color.pattern=Color must be a hex value like '#3b82f6'.
validation.category.type.required=Category type is required.

validation.recurring.frequency.required=Frequency is required.
validation.recurring.startDate.required=Start date is required.

validation.budget.limit.required=Limit is required.
validation.budget.limit.tooSmall=Limit must be greater than 0.
validation.budget.limit.tooLarge=Limit must not exceed 9,999,999.99.
validation.budget.limit.fraction=Limit must have at most 2 decimal places.

validation.account.name.required=Account name is required.
validation.account.name.tooLong=Account name must be at most 100 characters.
validation.account.initialBalance.required=Initial balance is required.
validation.account.initialBalance.fraction=Initial balance must have at most 2 decimal places.
validation.account.currency.required=Currency is required.

validation.loan.lent.required=Lent amount is required.
validation.loan.lent.tooSmall=Lent amount must be greater than 0.
validation.loan.lent.tooLarge=Lent amount must not exceed 9,999,999.99.
validation.loan.lent.fraction=Lent amount must have at most 2 decimal places.
validation.loan.owed.required=Owed amount is required.
validation.loan.owed.tooSmall=Owed amount must be 0 or greater.
validation.loan.owed.tooLarge=Owed amount must not exceed 9,999,999.99.
validation.loan.owed.fraction=Owed amount must have at most 2 decimal places.
validation.repayment.date.required=Repayment date is required.

# Generic error responses surfaced by the global exception handler.
error.validation.failed=Validation failed.
error.request.malformed=Malformed request body.
error.request.invalid=Invalid request.
error.unexpected=An unexpected error occurred.

# Auth-flow errors.
error.auth.invalidCredentials=Invalid username or password.
error.auth.emailNotConfirmed=Please confirm your email address.
error.auth.registrationDisabled=Registration is disabled.
error.auth.accountExists=An account with this username or email already exists.
error.auth.passwordRequirements=Password does not meet security requirements.
error.auth.passwordHashFailed=Password encoder returned null hash.
error.auth.userCreateFailed=User could not be created.

# User service errors.
error.user.notFound=User not found.
error.user.notFoundByUsername=User with username {0} not found.
error.user.profileUpdateFailed=Failed to update user profile.
error.user.pictureUpdateFailed=Failed to update profile picture.

# Registration confirmation email.
email.register.subject=Confirm your account · Centsible
email.register.preheader=One last step — confirm your email to start using Centsible.
email.register.eyebrow=Confirm your email
email.register.greeting.fallbackName=there
email.register.heading=Hi {0}, welcome to Centsible.
email.register.body=Thanks for signing up. Click the button below to confirm your email and start budgeting — no tracking, no ads, your data on your server.
email.register.cta=Confirm my account
email.register.fallbackPrompt=Button not working? Copy and paste this link into your browser:
email.register.expiry=This link expires in 24 hours. If you didn''t sign up for Centsible, you can safely ignore this email — no account will be created.
email.register.footer=Centsible · A clean, self-hosted budget tracker.

# Password reset email.
email.passwordReset.subject=Reset your password · Centsible
email.passwordReset.preheader=A password reset was requested for your Centsible account.
email.passwordReset.eyebrow=Reset your password
email.passwordReset.greeting.fallbackName=there
email.passwordReset.heading=Hi {0}, let''s get you back in.
email.passwordReset.body=We received a request to reset the password for your Centsible account. Click the button below to choose a new one.
email.passwordReset.cta=Reset my password
email.passwordReset.fallbackPrompt=Button not working? Copy and paste this link into your browser:
email.passwordReset.expiry=This link expires in 15 minutes. If you didn''t request a password reset, you can safely ignore this email — your password will not be changed.
email.passwordReset.footer=Centsible · A clean, self-hosted budget tracker.
