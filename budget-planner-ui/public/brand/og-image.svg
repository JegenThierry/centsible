<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <!-- Primary stays blush since OG images are baked at build time and can't read runtime theme. -->
    <radialGradient id="spotTL" cx="0%" cy="0%" r="65%">
      <stop offset="0" stop-color="#ee387e" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ee387e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spotBR" cx="100%" cy="100%" r="60%">
      <stop offset="0" stop-color="#ee387e" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ee387e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spotTR" cx="100%" cy="0%" r="50%">
      <stop offset="0" stop-color="#e7e5e4" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#e7e5e4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spotBL" cx="0%" cy="100%" r="50%">
      <stop offset="0" stop-color="#e7e5e4" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#e7e5e4" stop-opacity="0"/>
    </radialGradient>

    <pattern id="dots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1" fill="#d6d3d1"/>
    </pattern>

    <radialGradient id="dotVignette" cx="50%" cy="42%" r="58%">
      <stop offset="0" stop-color="white"/>
      <stop offset="1" stop-color="black"/>
    </radialGradient>
    <mask id="dotFade">
      <rect width="1200" height="630" fill="url(#dotVignette)"/>
    </mask>
  </defs>

  <!-- themed neutral-50 approximation (stone-50 with ~2% blush) -->
  <rect width="1200" height="630" fill="#faf6f5"/>
  <rect width="1200" height="630" fill="url(#spotTR)"/>
  <rect width="1200" height="630" fill="url(#spotBL)"/>
  <rect width="1200" height="630" fill="url(#spotTL)"/>
  <rect width="1200" height="630" fill="url(#spotBR)"/>
  <rect width="1200" height="630" fill="url(#dots)" mask="url(#dotFade)" opacity="0.5"/>

  <g transform="translate(96 232)">
    <rect width="180" height="180" rx="36" fill="#ee387e"/>
    <g transform="translate(36 36) scale(4.5)" fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.25">
      <path d="M11 17h3v2a1 1 0 0 0 1 1h2a1 1 0 0 0 1-1v-3a3.16 3.16 0 0 0 2-2h1a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1h-1a5 5 0 0 0-2-4V3a4 4 0 0 0-3.2 1.6l-.3.4H11a6 6 0 0 0-6 6v1a5 5 0 0 0 2 4v3a1 1 0 0 0 1 1h2a1 1 0 0 0 1-1z"/>
      <path d="M16 10h.01M2 8v1a2 2 0 0 0 2 2h1"/>
    </g>
  </g>

  <g transform="translate(316 244)">
    <g transform="translate(0 -64)">
      <rect width="244" height="40" rx="20" fill="#ee387e" fill-opacity="0.12"/>
      <text x="22" y="26" font-size="16" font-weight="600" fill="#b50f4d" letter-spacing="0.5">
        OPEN SOURCE · SELF-HOSTED
      </text>
    </g>
    <text y="78" font-size="104" font-weight="800" fill="#0f172a" letter-spacing="-2">Centsible</text>
    <text y="158" font-size="36" font-weight="500" fill="#334155">
      Take control of your money, without the bloat.
    </text>
    <text y="208" font-size="22" font-weight="400" fill="#64748b">
      Self-hosted budgets · Smart categories · Honest dashboards.
    </text>
  </g>
</svg>
