syntax = "proto3";

package beer.thierry.centsible.export;

option java_package = "beer.thierry.centsible.export.proto";
option java_multiple_files = true;

import "google/protobuf/timestamp.proto";

// Output format the worker should render. Default 0 = PDF preserves the original behavior of
// every ExportRequest written before this field existed. Add a new value at the end (never
// renumber) when introducing another format.
enum ExportFormat {
  PDF = 0;
  CSV = 1;
  JSON = 2;
}

message ExportMeta {
  string user_id = 1;
  string user_display_name = 2;
  string user_email = 3;
  string locale = 4;
  string currency = 5;
  google.protobuf.Timestamp requested_at = 6;
}

message ExportRequest {
  ExportMeta meta = 1;
  ExportFormat format = 2;

  oneof body {
    TransactionsRequest       transactions          = 10;
    LendingsPerContactRequest lendings_per_contact  = 11;
    LendingsAllRequest        lendings_all          = 12;
    AccountsSummaryRequest    accounts_summary      = 13;
  }
}

message TransactionsRequest {
  repeated string account_ids = 1;
  string from_date = 2;
  string to_date = 3;
  repeated int64 category_ids = 4;
}

message LendingsPerContactRequest {
  string contact_id = 1;
}

message LendingsAllRequest {
  bool include_settled = 1;
}

message AccountsSummaryRequest {
  string as_of_date = 1;
}
