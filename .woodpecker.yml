# Codeberg / Woodpecker CI — foundation pipeline.
# Docs: https://woodpecker-ci.org/docs/usage/intro
when:
  - event: [push, pull_request, manual]

steps:
  backend-build:
    image: eclipse-temurin:21-jdk
    commands:
      # `build` runs the DB-free unit suite; Postgres-backed tests are tagged `integration`
      # and only run via `./gradlew integrationTest`. Add a `services:` block with
      # `postgres:18` and run `integrationTest` once a CI-side schema/migration story is in place.
      - ./gradlew build --no-daemon

  backend-dependency-report:
    image: eclipse-temurin:21-jdk
    commands:
      - ./gradlew dependencyReportAll --no-daemon

  frontend-typecheck:
    image: node:20
    commands:
      - cd centsible-ui
      - npm ci
      # CVE gate for the npm tree — fails on high/critical advisories in production deps.
      - npm audit --omit=dev --audit-level=high
      - npx tsc --noEmit -p tsconfig.json
