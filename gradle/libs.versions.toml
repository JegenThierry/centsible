[versions]
kotlin = "2.3.10"
ksp = "2.3.6"
konvert = "4.5.0"
springBoot = "4.0.7"
dependencyManagement = "1.1.7"
jjwt = "0.12.6"
jooq = "3.19.29"
protobuf = "4.35.0"
protobufPlugin = "0.9.5"
pebble = "3.2.4"
playwright = "1.60.0"
bucket4j = "8.10.1"
caffeine = "3.1.8"
totp = "1.7.1"
commonsCsv = "1.12.0"
resilience4j = "2.3.0"
ofx4j = "1.39"
guava = "33.6.0-jre"
tika = "3.3.1"
dependencyCheck = "12.1.0"

[libraries]
spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter" }
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-jooq = { module = "org.springframework.boot:spring-boot-starter-jooq" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }

spring-tx = { module = "org.springframework:spring-tx" }
spring-web = { module = "org.springframework:spring-web" }
spring-security-crypto = { module = "org.springframework.security:spring-security-crypto" }
spring-data-commons = { module = "org.springframework.data:spring-data-commons" }

kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind" }
jackson-module-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin" }
postgresql = { module = "org.postgresql:postgresql" }

jjwt-api = { group = "io.jsonwebtoken", name = "jjwt-api", version.ref = "jjwt" }
jjwt-impl = { group = "io.jsonwebtoken", name = "jjwt-impl", version.ref = "jjwt" }
jjwt-jackson = { group = "io.jsonwebtoken", name = "jjwt-jackson", version.ref = "jjwt" }

protobuf-java = { module = "com.google.protobuf:protobuf-java", version.ref = "protobuf" }
protobuf-java-util = { module = "com.google.protobuf:protobuf-java-util", version.ref = "protobuf" }
pebble = { module = "io.pebbletemplates:pebble", version.ref = "pebble" }
playwright = { module = "com.microsoft.playwright:playwright", version.ref = "playwright" }
bucket4j-core = { module = "com.bucket4j:bucket4j-core", version.ref = "bucket4j" }
caffeine = { module = "com.github.ben-manes.caffeine:caffeine", version.ref = "caffeine" }
totp = { module = "dev.samstevens.totp:totp", version.ref = "totp" }
commons-csv = { module = "org.apache.commons:commons-csv", version.ref = "commonsCsv" }
resilience4j-retry = { module = "io.github.resilience4j:resilience4j-retry", version.ref = "resilience4j" }
ofx4j = { module = "com.webcohesion.ofx4j:ofx4j", version.ref = "ofx4j" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
tika-core = { module = "org.apache.tika:tika-core", version.ref = "tika" }
konvert-api = { module = "io.mcarle:konvert-api", version.ref = "konvert" }
konvert-ksp = { module = "io.mcarle:konvert", version.ref = "konvert" }

spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-security-test = { module = "org.springframework.security:spring-security-test" }
spring-boot-starter-jooq-test = { module = "org.springframework.boot:spring-boot-starter-jooq-test" }
spring-boot-starter-webmvc-test = { module = "org.springframework.boot:spring-boot-starter-webmvc-test" }
kotlin-test-junit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5" }
mockito-core = { module = "org.mockito:mockito-core" }
mockito-junit-jupiter = { module = "org.mockito:mockito-junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
dependency-management = { id = "io.spring.dependency-management", version.ref = "dependencyManagement" }
jooq-codegen = { id = "org.jooq.jooq-codegen-gradle", version.ref = "jooq" }
protobuf = { id = "com.google.protobuf", version.ref = "protobufPlugin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
dependency-check = { id = "org.owasp.dependencycheck", version.ref = "dependencyCheck" }
